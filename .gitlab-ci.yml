# Cross-platform checks: the tool is started exactly like a user would (run_linux_mac.sh),
# then the full test suite runs inside the virtual environment that run_linux_mac.sh created.

stages: [test]

.linux_smoke: &linux_smoke
  stage: test
  script:
    - sh run_linux_mac.sh --no-browser --port 8765 > gui.log 2>&1 &
    - for i in $(seq 1 180); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 2; done
    - curl -sf http://127.0.0.1:8765/ | grep -q "PromptInjectionFinder"
    - curl -sf http://127.0.0.1:8765/static/app.js >/dev/null
    - .venv/bin/python -m pip install -q pytest
    - .venv/bin/python -m pytest -q
    - .venv/bin/python -m pif scan samples || test $? -eq 1
  after_script:
    - cat gui.log || true

debian-python3.9:
  <<: *linux_smoke
  image: python:3.9-slim-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl >/dev/null

debian-python3.13:
  <<: *linux_smoke
  image: python:3.13-bookworm

debian-12-system-python:
  <<: *linux_smoke
  image: debian:12
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv curl >/dev/null

ubuntu-24.04:
  <<: *linux_smoke
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv curl >/dev/null

archlinux:
  <<: *linux_smoke
  image: archlinux:latest
  before_script:
    - pacman -Sy --noconfirm --needed python curl >/dev/null

fedora:
  <<: *linux_smoke
  image: fedora:latest
  before_script:
    - dnf install -y -q python3 curl >/dev/null
