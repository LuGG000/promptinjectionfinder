# Cross-platform checks: the tool is started exactly like a user would (run_linux_mac.sh),
# then the full test suite runs inside the virtual environment that run_linux_mac.sh created.

stages: [test, release]

.linux_smoke: &linux_smoke
  stage: test
  script:
    - sh run_linux_mac.sh --no-browser --port 8765 > gui.log 2>&1 &
    - for i in $(seq 1 180); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 2; done
    - curl -sf http://127.0.0.1:8765/ | grep -q "PromptInjectionFinder"
    - curl -sf http://127.0.0.1:8765/static/app.js >/dev/null
    - .venv/bin/python -m pip install -q pytest
    - .venv/bin/python -m pytest -q
    - .venv/bin/python -m pif scan samples || test $? -eq 1
  after_script:
    - cat gui.log || true

debian-python3.9:
  <<: *linux_smoke
  image: python:3.9-slim-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl >/dev/null

debian-python3.13:
  <<: *linux_smoke
  image: python:3.13-bookworm

debian-12-system-python:
  <<: *linux_smoke
  image: debian:12
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv curl >/dev/null

ubuntu-24.04:
  <<: *linux_smoke
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv curl >/dev/null

archlinux:
  <<: *linux_smoke
  image: archlinux:latest
  before_script:
    - pacman -Sy --noconfirm --needed python curl >/dev/null

fedora:
  <<: *linux_smoke
  image: fedora:latest
  before_script:
    - dnf install -y -q python3 curl >/dev/null

# The one-line installer, exactly as a user runs it (local source instead of git clone).
install-script-debian:
  stage: test
  image: debian:12
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-venv git >/dev/null
  script:
    - PIF_SOURCE="$CI_PROJECT_DIR" PIF_DIR="$HOME/pif" PIF_NO_SHORTCUTS=1 sh install.sh
    - test -x "$HOME/.local/bin/pif"
    - '"$HOME/.local/bin/pif" scan samples || test $? -eq 1'
    - '"$HOME/.local/bin/pif" --version'
    - grep -q PIF_LAUNCH "$HOME/.local/bin/pif"
    # simulated system Python upgrade (3.11 -> other minor version): the next start recreates .venv
    - mv "$HOME"/pif/.venv/lib/python3.* "$HOME/pif/.venv/lib/python3.0"
    - '"$HOME/.local/bin/pif" --version'
    - test ! -e "$HOME/pif/.venv/lib/python3.0"
    # simulated removed base Python (dangling interpreter link)
    - ln -sf /nonexistent/python3 "$HOME/pif/.venv/bin/python"
    - '"$HOME/.local/bin/pif" scan samples/benign_notes.md'

# Every tag vX.Y.Z becomes a GitLab release (uses the job token, no secrets needed).
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+([.][0-9]+)?$/'
  script:
    - echo "Erstelle Release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "PromptInjectionFinder $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG – Installation/Update: siehe README (install.sh / install.ps1, pif update)."
